<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1320" viewBox="0 0 1920 1320" role="img" aria-labelledby="title desc">
<title id="title">SiliconBadgers | what current main actually connects</title><desc id="desc">19 Oct 2026 source snapshot. Green = real RTL; pink dashed = simulation-only; gray dashed = unsupported endpoint fixtures.</desc>
<defs>
<marker id="data" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#2369b1"/></marker>
<marker id="control" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#7950a5"/></marker>
<marker id="rtl" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#087c72"/></marker>
<marker id="platform" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#a25c08"/></marker>
</defs>
<rect width="1920" height="100%" fill="white"/>
<text x="60" y="55" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#182638" text-anchor="start">SiliconBadgers | what current main actually connects</text>
<text x="60" y="91" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#182638" text-anchor="start">19 Oct 2026 source snapshot. Green = real RTL; pink dashed = simulation-only; gray dashed = unsupported endpoint fixtures.</text>
<rect x="80" y="170" width="1760" height="145" rx="12" fill="#fff0f0" stroke="#af4858" stroke-width="2" stroke-dasharray="9 5"/>
<text x="98" y="202" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#af4858" text-anchor="start">C++ simulation host / memory / MMIO service [S1, S2] — outside a synthesizable device</text>
<text x="98" y="233" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#182638" text-anchor="start">sim_host.hpp + sim/matrix_memory.hpp: mailbox, 64 KiB RAM, MMIO decode and instantaneous descriptor capture.</text>
<text x="98" y="260" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#182638" text-anchor="start">Host tests / llama.cpp observation run on CPU. RAM and tensor callbacks are software; no implemented physical host link, SRAM arbiter, HBM or DMA.</text>
<text x="98" y="287" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#182638" text-anchor="start">Firmware publishes descriptor pointer / doorbell and polls completion. Interrupt / debug / bus-error inputs are tied inactive.</text>
<rect x="50" y="440" width="1810" height="655" rx="16" fill="#fbfcfe" stroke="#7f8fa4" stroke-width="2"/>
<text x="70" y="472" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#7f8fa4" text-anchor="start"></text>
<rect x="560" y="500" width="1240" height="545" rx="16" fill="#ffffff" stroke="#7f8fa4" stroke-width="2"/>
<text x="580" y="532" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#7f8fa4" text-anchor="start"></text>
<text x="80" y="1073" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#182638" text-anchor="start">soc/sim/control_path_sim_top.sv — simulation assembly, not a production chip top [S1]</text>
<text x="580" y="1036" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#182638" text-anchor="start">u_command_router_test: command_router_test_top, EnableMatrix=1 [S2]</text>
<rect x="100" y="560" width="390" height="155" rx="12" fill="#e9f7f2" stroke="#087c72" stroke-width="2" />
<text x="118" y="592" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#087c72" text-anchor="start">u_riscv: riscv_wrapper</text>
<text x="118" y="623" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#182638" text-anchor="start">Ibex + FF register file</text>
<text x="118" y="650" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#182638" text-anchor="start">OR upstream CV32E40P</text>
<text x="118" y="677" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#182638" text-anchor="start">RV32IM firmware; core not selected</text>
<rect x="600" y="570" width="420" height="145" rx="12" fill="#e9f7f2" stroke="#087c72" stroke-width="2" />
<text x="618" y="602" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#087c72" text-anchor="start">u_command_router [R4]</text>
<text x="618" y="633" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#182638" text-anchor="start">Single-command routing pilot</text>
<text x="618" y="660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#182638" text-anchor="start">Owns command until completion consumed</text>
<text x="618" y="687" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#182638" text-anchor="start">quiesce_i blocks new acceptance</text>
<rect x="1120" y="570" width="640" height="145" rx="12" fill="#fff0f0" stroke="#af4858" stroke-width="2" stroke-dasharray="9 5"/>
<text x="1138" y="602" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#af4858" text-anchor="start">g_matrix_array.u_matrix: matrix_command_adapter</text>
<text x="1138" y="633" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#182638" text-anchor="start">Simulation-only SRAM / command wrapper</text>
<text x="1138" y="660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#182638" text-anchor="start">DPI-C byte reads + INT32 writes in C++ RAM</text>
<text x="1138" y="687" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#182638" text-anchor="start">Layout validation, drain, success / error completion</text>
<polyline points="285,560 285,315" fill="none" stroke="#2369b1" stroke-width="3" stroke-linejoin="round" marker-end="url(#data)" marker-start="url(#data)" />
<text x="305" y="355" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2369b1" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">instruction / data</text>
<text x="305" y="379" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2369b1" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">request / grant / response</text>
<polyline points="800,315 800,570" fill="none" stroke="#7950a5" stroke-width="3" stroke-linejoin="round" marker-end="url(#control)" marker-start="url(#control)" />
<text x="820" y="355" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#7950a5" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">cmd_valid / ready + command_t</text>
<text x="820" y="379" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#7950a5" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">completion_valid / ready + completion_t</text>
<text x="820" y="403" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#7950a5" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">via C++ MMIO / descriptor model</text>
<polyline points="1500,570 1500,315" fill="none" stroke="#2369b1" stroke-width="3" stroke-linejoin="round" marker-end="url(#data)" marker-start="url(#data)" />
<text x="1520" y="370" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2369b1" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">DPI-C tensor accesses</text>
<text x="1520" y="394" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2369b1" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">zero modeled bus cycles</text>
<polyline points="1020,610 1120,610" fill="none" stroke="#7950a5" stroke-width="3" stroke-linejoin="round" marker-end="url(#control)" />
<text x="1070" y="595" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#7950a5" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">accept</text>
<polyline points="1120,680 1020,680" fill="none" stroke="#7950a5" stroke-width="3" stroke-linejoin="round" marker-end="url(#control)" stroke-dasharray="8 5" />
<text x="1070" y="666" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#7950a5" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">complete</text>
<rect x="1120" y="870" width="640" height="145" rx="12" fill="#e9f7f2" stroke="#087c72" stroke-width="2" />
<text x="1138" y="902" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#087c72" text-anchor="start">u_matrix_array: bpu_sa_array [R1]</text>
<text x="1138" y="933" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#182638" text-anchor="start">SoC adapter uses 8 × 8, AccW=32, mode_i=0</text>
<text x="1138" y="960" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#182638" text-anchor="start">bpu_sa_pe + bpu_sa_delay; INT8 in / INT32 out</text>
<text x="1138" y="987" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#182638" text-anchor="start">These test dimensions do not fix the whole-chip array.</text>
<polyline points="1310,715 1310,870" fill="none" stroke="#2369b1" stroke-width="3" stroke-linejoin="round" marker-end="url(#data)" />
<text x="1290" y="776" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2369b1" text-anchor="end" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">A row valid / ready</text>
<text x="1290" y="800" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2369b1" text-anchor="end" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">B column valid / ready</text>
<polyline points="1560,870 1560,715" fill="none" stroke="#2369b1" stroke-width="3" stroke-linejoin="round" marker-end="url(#data)" />
<text x="1580" y="776" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2369b1" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">C column + valid</text>
<text x="1580" y="800" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2369b1" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">No ready input</text>
<rect x="600" y="870" width="420" height="145" rx="12" fill="#f0f1f3" stroke="#6d7784" stroke-width="2" stroke-dasharray="5 4"/>
<text x="618" y="902" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#6d7784" text-anchor="start">engine_stub endpoints [S2]</text>
<text x="618" y="933" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#182638" text-anchor="start">u_vector, u_state, u_memory:</text>
<text x="618" y="960" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#182638" text-anchor="start">terminal UNIMPLEMENTED</text>
<text x="618" y="987" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#182638" text-anchor="start">u_invalid: BAD_COMMAND</text>
<polyline points="750,715 750,870" fill="none" stroke="#7950a5" stroke-width="3" stroke-linejoin="round" marker-end="url(#control)" />
<polyline points="930,870 930,715" fill="none" stroke="#7950a5" stroke-width="3" stroke-linejoin="round" marker-end="url(#control)" stroke-dasharray="8 5" />
<text x="735" y="770" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#7950a5" text-anchor="end" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">accept</text>
<text x="945" y="770" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#7950a5" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">error</text>
<text x="60" y="1155" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#182638" text-anchor="start">All shown RTL endpoints share clk_i / rst_ni in the harness. Active-low reset is not a production drain / CDC contract.</text>
<text x="60" y="1183" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#182638" text-anchor="start">Default command_router_test_top has a matrix stub too; control_path_sim_top explicitly enables the real array adapter.</text>
<text x="60" y="1211" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#182638" text-anchor="start">SoC pins RTL 564aa7b0fdb6; current RTL main cf1916b49d20 has newer matrix / SRAM interface documentation.</text>
<text x="60" y="1239" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#182638" text-anchor="start">Open SoC PR #11 proposes HLS memory + soc_top; it is unmerged and is not the current-main hierarchy or a full-chip implementation.</text>
<text x="60" y="1267" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#182638" text-anchor="start">This documentation change runs no RTL simulation. Historical VCS results are linked in the source note; no new hardware claim is made.</text>
</svg>
